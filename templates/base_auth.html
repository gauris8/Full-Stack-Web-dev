<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NutriGym</title>
     
    <!-- Page-specific CSS will be added from child templates -->
    {% block head %}{% endblock %}
</head>
<style>

/* ---------- Flash Container ---------- */
.flash-container {
    width: 90%;
    max-width: 500px;
    margin: 20px auto;
    animation: slideDown 0.4s ease-out;
}

/* Each alert */
.alert {
    padding: 14px 18px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 16px;
    font-family: Arial, sans-serif;
    border-left: 5px solid;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    animation: fadeIn 0.3s ease-in;
}

/* Success */
.alert.success {
    background: #d4edda;
    color: #155724;
    border-color: #28a745;
}

/* Error */
.alert.error {
    background: #f8d7da;
    color: #721c24;
    border-color: #dc3545;
}

/* Info */
.alert.info {
    background: #d1ecf1;
    color: #0c5460;
    border-color: #17a2b8;
}

/* Warning */
.alert.warning {
    background: #fff3cd;
    color: #856404;
    border-color: #ffc107;
}

/* Slide Down Animation */
@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Fade In Animation */
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Optional auto fade-out after 4 seconds — enable if you want */
.fade-out {
    animation: disappear 1s ease-out 4s forwards;
}

@keyframes disappear {
    to {
        opacity: 0;
        transform: translateY(-10px);
    }
}

</style>

<body>

    <!-- 🔥 FLASH MESSAGES HERE -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-container">
                {% for category, message in messages %}
                    <div class="alert {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <!-- Page content -->
    {% block content %}{% endblock %}

</body>
</html>
