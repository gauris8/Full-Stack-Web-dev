<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NutriGym Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <script src="https://kit.fontawesome.com/cdbcc992f6.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="login-container">
        <div class="info-box">
            <h1><i class="fas fa-user-plus"></i> Join NutriGym!</h1>
            <p>
                <i class="fas fa-seedling"></i> Start your journey to a healthier you.<br>
                <span class="highlight"><i class="fas fa-heart"></i> Nutrition. Fitness. Community.</span>
            </p>
        </div>
        <form method="POST" class="login-form">
            <h2><i class="fas fa-user-plus"></i> Register</h2>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit"><i class="fas fa-user-plus"></i> Register</button>
            <p>Already have an account? <a href="{{ url_for('login') }}"><i class="fas fa-sign-in-alt"></i> Login here</a></p>
        </form>
        {% include 'fact_box.html' %}
    </div>
</body>
</html>
