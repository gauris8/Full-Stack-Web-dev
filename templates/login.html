<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NutriGym Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <script src="https://kit.fontawesome.com/cdbcc992f6.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="login-container">
        <div class="info-box">
            <h1><i class="fas fa-apple-alt"></i> Welcome to NutriGym!</h1>
            <p>
                <i class="fas fa-dumbbell"></i> Personalized nutrition & fitness planning.<br>
                <span class="highlight"><i class="fas fa-heartbeat"></i> Eat smart. Train hard. Live better.</span>
            </p>
        </div>
        <form method="POST" class="login-form">
            <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit"><i class="fas fa-arrow-right"></i> Login</button>
            <p>Don't have an account? <a href="{{ url_for('register') }}"><i class="fas fa-user-plus"></i> Register here</a></p>
        </form>
        {% include 'fact_box.html' %}
    </div>
</body>
</html>
