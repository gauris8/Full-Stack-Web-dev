<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nutritional Gym App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://kit.fontawesome.com/cdbcc992f6.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav>
    <a href="{{ url_for('dashboard') }}"><i class="fas fa-home"></i> Dashboard</a>
    <a href="{{ url_for('gym') }}"><i class="fas fa-dumbbell"></i> Gym</a>
    <a href="{{ url_for('recipes') }}"><i class="fas fa-utensils"></i> Recipes</a>
    <a href="{{ url_for('profile') }}"><i class="fas fa-user"></i> Profile</a>
    {% if is_admin %}
    <a href="{{ url_for('admin') }}"><i class="fas fa-user-shield"></i> Admin</a>
    {% endif %}
    <a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a>
</nav>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul id="alerts">
        {% for category, message in messages %}
          <li class="alert {{ category }}">{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
