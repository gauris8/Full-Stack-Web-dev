{% extends "base.html" %}
{% block content %}
<h2>Edit Profile</h2>
<form method="post">
    <label>Age:</label>
    <input type="number" name="age" min="10" max="100" value="{{ user.age or '' }}">
    <label>Weight (kg):</label>
    <input type="number" name="weight" min="30" max="200" step="0.1" value="{{ user.weight or '' }}">
    <label>Gender:</label>
    <select name="gender">
        <option value="">Select</option>
        <option value="male" {% if user.gender == 'male' %}selected{% endif %}>Male</option>
        <option value="female" {% if user.gender == 'female' %}selected{% endif %}>Female</option>
        <option value="other" {% if user.gender == 'other' %}selected{% endif %}>Other</option>
    </select>
    <label>Goal:</label>
    <select name="goal">
        <option value="maintain" {% if user.goal == 'maintain' %}selected{% endif %}>Maintain Weight</option>
        <option value="lose" {% if user.goal == 'lose' %}selected{% endif %}>Lose Weight</option>
        <option value="gain" {% if user.goal == 'gain' %}selected{% endif %}>Gain Weight</option>
    </select>
    <button type="submit">Update Profile</button>
</form>
{% endblock %}
