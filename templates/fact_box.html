<div class="fact-box" id="fact-box">
    <i class="fas fa-lightbulb"></i>
    <span id="fact-text">Loading fact...</span>
</div>
<script>
const facts = [
    "Fact:Protein helps build and repair muscle tissue.",
    "Fact:Drinking water before meals can help with weight loss.",
    "Fact:Carbohydrates are your body's main source of energy.",
    "Fact:Healthy fats are essential for hormone production.",
    "Fact:Consistent sleep improves workout recovery.",
    "Fact:Leafy greens are packed with vitamins and minerals.",
    "Fact:Strength training boosts metabolism.",
    "Fact:Breakfast kickstarts your metabolism for the day."
];
let factIndex = 0;
function showNextFact() {
    document.getElementById('fact-text').textContent = facts[factIndex];
    factIndex = (factIndex + 1) % facts.length;
}
showNextFact();
setInterval(showNextFact, 6000); // Change fact every 6 seconds
</script>
<style>
.fact-box {
    margin: 32px auto 0 auto;
    max-width: 400px;
    background: #f1f5f9;
    border-left: 6px solid #4f46e5;
    border-radius: 8px;
    padding: 18px 20px;
    font-size: 1.1em;
    color: #3730a3;
    box-shadow: 0 2px 8px rgba(79,70,229,0.08);
    text-align: center;
}
</style>
